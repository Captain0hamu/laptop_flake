# Basic appearance, matched to the current Konsole Breeze profile.
font_family JetBrainsMono Nerd Font Mono
font_size 10.0

# This is the fallback colour after an application resets its styling.
# Bash switches to blue only while accepting a command (see files/bash/bashrc).
foreground #b8b8b8
background #232627
background_opacity 0.28
dynamic_background_opacity yes

cursor #cfbea5
selection_foreground #fcfcfc
selection_background #1d99f3

color0  #232627
color8  #7f8c8d
color1  #f74f25
color9  #f74f25
color2  #11d116
color10 #1cdc9a
color3  #f67400
color11 #fdbc4b
color4  #1d99f3
color12 #3daee9
color5  #eae2c6
color13 #f0eebb
color6  #1abc9c
color14 #2decd6
color7  #fcfcfc
color15 #ffffff

#cursor_trail 7

scrollback_lines 10000
enable_audio_bell no

tab_bar_style powerline
tab_powerline_style slanted

# Use kitty's free split layout by default.
enabled_layouts splits,tall,stack,fat

# Tabs and config.
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+f5 load_config_file

# Splits/windows.
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+[ launch --location=hsplit --cwd=current
map ctrl+shift+] launch --location=vsplit --cwd=current

# Resize the active split.
map ctrl+[ resize_window wider
map ctrl+] resize_window narrower
map ctrl+shift+backslash resize_window reset

# Vim-style focus movement between splits.
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+m toggle_fullscreen
